name: Deploy Open WebUI to Cloud Run

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  PROJECT_ID: employee-ai-508209
  REGION: us-central1
  SERVICE: openwebui
  AR_REPOSITORY: openwebui-repo
  IMAGE_NAME: open-webui

permissions:
  contents: read
  id-token: write

jobs:

  deploy:
    name: Build and Deploy Open WebUI
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------
      # 1. Checkout source
      # ---------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4

      # ---------------------------------------------------
      # 2. Authenticate to Google Cloud
      # ---------------------------------------------------
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: github-actions-deployer@employee-ai-508209.iam.gserviceaccount.com
          project_id: employee-ai-508209

      # ---------------------------------------------------
      # 3. Setup gcloud
      # ---------------------------------------------------
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      # ---------------------------------------------------
      # 4. Configure Docker authentication
      # ---------------------------------------------------
      - name: Configure Docker
        run: |
          gcloud auth configure-docker \
            ${REGION}-docker.pkg.dev \
            --quiet

      # ---------------------------------------------------
      # 5. Create immutable image tag
      # ---------------------------------------------------
      - name: Set image
        id: image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"

          echo "IMAGE=${IMAGE}" >> "$GITHUB_OUTPUT"

          echo "Building:"
          echo "${IMAGE}"

      # ---------------------------------------------------
      # 6. Build Docker image
      # ---------------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            --tag "${{ steps.image.outputs.IMAGE }}" \
            .

      # ---------------------------------------------------
      # 7. Push image
      # ---------------------------------------------------
      - name: Push Docker image
        run: |
          docker push "${{ steps.image.outputs.IMAGE }}"

      # ---------------------------------------------------
      # 8. Deploy to Cloud Run
      # ---------------------------------------------------
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE}" \
            --image="${{ steps.image.outputs.IMAGE }}" \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --quiet

      # ---------------------------------------------------
      # 9. Wait for deployment
      # ---------------------------------------------------
      - name: Verify deployment
        run: |
          gcloud run services describe "${SERVICE}" \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --format="value(status.latestReadyRevisionName)"

      # ---------------------------------------------------
      # 10. Show deployed image
      # ---------------------------------------------------
      - name: Show deployed image
        run: |
          gcloud run services describe "${SERVICE}" \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --format="value(spec.template.spec.containers[0].image)"
